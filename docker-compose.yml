services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monitoring_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9095:9094"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: monitoring_platform
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: app
    ports:
      - "8124:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build:
      context: ./backend
      target: api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment: &backend-env
      NODE_ENV: production
      PORT: "8001"
      WS_PORT: "8002"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:19006
      JWT_SECRET: dev-secret-change-me
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      DEVICE_TOKEN_EXPIRE_MINUTES: "43200"
      PAIRING_CODE_TTL_SECONDS: "300"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monitoring_platform
      POSTGRES_SCHEMA: public
      POSTGRES_SSL: "false"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: monitoring_platform
      MONGO_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_SSL: "false"
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: monitoring-platform
      KAFKA_SSL: "false"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: app
      CLICKHOUSE_DB: monitoring_platform
      CLICKHOUSE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  backend-websocket:
    build:
      context: ./backend
      target: websocket
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment: *backend-env
    depends_on:
      # Needs Postgres (read-only device/permission lookups) and Kafka
      # (device-metrics producer + dashboard-fanout consumer) — not Mongo,
      # ClickHouse, or Redis (no longer used by this process).
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      backend-api:
        condition: service_started

  backend-ingestion-worker:
    build:
      context: ./backend
      target: ingestion-worker
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      # Mongo (durable writes) and Kafka (device-metrics consumer) — not
      # Postgres, ClickHouse, or Redis.
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  backend-cron-worker:
    build:
      context: ./backend
      target: cron-worker
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      # Postgres only.
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_started

volumes:
  postgres_data:
  mongo_data:
  clickhouse_data:
  kafka_data:
