appId: com.monitoringplatform.desktop
productName: System Monitor
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
artifactName: '${productName}-Setup-${os}.${ext}'
